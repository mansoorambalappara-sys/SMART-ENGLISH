.big .l{font-size:70px;font-weight:900;color:#e63946;text-shadow:0 4px 0 #ffb703}

.opt.ok{background:#38b000;color:#fff;animation:pop .4s}.opt.no{background:#e63946;color:#fff;animation:shake .4s}

.row{display:flex;gap:8px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;margin:10px 0;box-shadow:0 5px 0 #0002}
.row .t{flex:1}.row .t b{font-size:19px;display:block}.row .t small{color:#555}
.row .btn{padding:8px 12px;box-shadow:0 4px 0 #0003;background:#ffd166}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tile{width:54px;height:60px;border-radius:14px;border:0;font:inherit;font-size:28px;font-weight:900;background:#4cc9f0;color:#fff;box-shadow:0 6px 0 #0003;cursor:pointer}
.slot{width:54px;height:60px;border-radius:14px;background:#fff8;border:3px dashed #7b2ff7;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#7b2ff7}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:900px}
.fl{height:90px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fl.on{transform:rotateY(180deg)}
.fl div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;box-shadow:0 5px 0 #0003}
.fl .f{background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;font-size:34px}
.fl .b{background:#fff;transform:rotateY(180deg);font-size:15px;flex-direction:column}
.fl.done .b{background:#caffbf}
.msg{text-align:center;font-weight:800;font-size:20px;min-height:30px}
.sc{border-radius:28px;padding:14px;text-align:center;color:#fff;box-shadow:0 8px 0 #0003;margin:8px 0}
.ch{font-size:84px;display:inline-block;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0004)}
.bb{max-width:85%;padding:10px 14px;border-radius:20px;margin:8px 0;background:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 0 #0002;cursor:pointer;transition:.2s}
.bb.r{margin-left:auto;background:#caffbf}.bb.hl{transform:scale(1.06);background:#ffd166}
.bb small{display:block;color:#555;font-weight:400;font-size:14px}
.mas{text-align:center;font-size:46px;cursor:pointer}.mas span{display:inline-block;animation:bob 1.6s infinite}
