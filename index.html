.sc{border-radius:28px;padding:14px;text-align:center;color:#fff;box-shadow:0 8px 0 #0003;margin:8px 0}
.ch{font-size:84px;display:inline-block;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0004)}

.sq{min-width:54px;height:60px;padding:0 12px;border-radius:14px;background:#fff;font-size:28px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0003;color:#7b2ff7}

.pv{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}

.sqt,.sqs{width:auto;min-width:54px;padding:0 12px}
.tile.no{animation:shake .4s;background:#e63946}
.sub{text-align:center;font-weight:700;margin:6px 0;color:#2b2d42}

NGF.math=function(){var L=lv,a,b,op,ans,E=rnd(["🍎","⭐","🐟","🎈"]),h;
if(L==0){op=rnd(["+","−"]);if(op=="+"){a=ri(1,5);b=ri(1,Math.min(5,10-a));ans=a+b}else{a=ri(2,10);b=ri(1,a-1);ans=a-b}}
else if(L==1){op=rnd(["+","−"]);if(op=="+"){a=ri(2,18);b=ri(1,20-a);ans=a+b}else{a=ri(5,20);b=ri(1,a-1);ans=a-b}}

else if(L==3){op=rnd(["+","−","×"]);if(op=="+"){a=ri(100,600);b=ri(20,350);ans=a+b}else if(op=="−"){a=ri(200,900);b=ri(20,a-50);ans=a-b}else{a=ri(2,6);b=ri(2,10);ans=a*b}}
